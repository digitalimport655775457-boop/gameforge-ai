    <script>
      (function() {
        // Intercept and handle Vite HMR WebSocket in container environment
        if (typeof window !== 'undefined') {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && url.indexOf('token=') !== -1 && url.indexOf('24678') !== -1)) {
                var mockWs = {
                  binaryType: 'blob',
                  readyState: 1, // OPEN
                  send: function() {},
                  close: function() { this.readyState = 3; if (this.onclose) this.onclose({ code: 1000, reason: 'Normal Closure', wasClean: true }); },
                  addEventListener: function(type, fn) {
                    if (type === 'open') setTimeout(fn, 10);
                  },
                  removeEventListener: function() {}
                };
                setTimeout(function() {
                  if (mockWs.onopen) mockWs.onopen({ type: 'open' });
                }, 10);
                return mockWs;
              }
              return new (Function.prototype.bind.apply(OrigWS, [null].concat(Array.prototype.slice.call(arguments))))();
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        }

        function checkVite(val) {
          if (!val) return false;
          try {
            if (typeof val === 'string') {
              return val.indexOf('[vite]') !== -1 || val.indexOf('vite:') !== -1 || val.indexOf('vite-hmr') !== -1;
            }
            if (val instanceof Error || typeof val.message === 'string') {
              var msg = val.message || '';
              if (msg.indexOf('[vite]') !== -1 || msg.indexOf('vite:') !== -1) return true;
            }
            if (typeof val.stack === 'string' && (val.stack.indexOf('[vite]') !== -1 || val.stack.indexOf('@vite/client') !== -1)) {
              return true;
            }
            var s = String(val);
            return s.indexOf('[vite]') !== -1 || s.indexOf('vite:') !== -1;
          } catch (_) {
            return false;
          }
        }
        function hasVite(args) {
          for (var i = 0; i < args.length; i++) {
            if (checkVite(args[i])) return true;
          }
          return false;
        }
        function wrap(orig) {
          return function() {
            if (hasVite(arguments)) return;
            return orig.apply(this, arguments);
          };
        }
        console.error = wrap(console.error);
        console.warn = wrap(console.warn);
        console.log = wrap(console.log);
        console.info = wrap(console.info);
        console.debug = wrap(console.debug);

        window.addEventListener('error', function(e) {
          if (e && (checkVite(e.message) || checkVite(e.error) || checkVite(e.filename))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && checkVite(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
